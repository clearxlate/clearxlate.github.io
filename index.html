<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Something Is Moving</title>
  <meta name="description" content="A fast, modern landing page for something important, useful, and hard to describe." />
  <style>
    :root {
      --bg: #0b1020;
      --bg-soft: #121933;
      --card: rgba(255,255,255,0.06);
      --card-border: rgba(255,255,255,0.12);
      --text: #eef2ff;
      --muted: #a7b0d6;
      --accent: #7c9cff;
      --accent-2: #8ef0d0;
      --shadow: 0 20px 60px rgba(0,0,0,0.35);
      --radius: 22px;
      --max: 1180px;
    }

    * { box-sizing: border-box; }
    html {
      scroll-behavior: smooth;
      height: 100%;
    }
    body {
      min-height: 100%;
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(124,156,255,0.18), transparent 34%),
        radial-gradient(circle at 80% 20%, rgba(142,240,208,0.12), transparent 28%),
        linear-gradient(180deg, #09101d 0%, #0b1020 45%, #0e1530 100%);
      line-height: 1.5;
    }

    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    .container {
      width: min(calc(100% - 2rem), var(--max));
      margin: 0 auto;
    }

    h1, h2, h3 { line-height: 1.05; margin: 0; }

    /* h1 {
      font-size: clamp(2.8rem, 7vw, 5.6rem);
      letter-spacing: -0.05em;
      max-width: 12ch;
    } */
    .hero-card {
      padding: 1.2rem;
      border-radius: calc(var(--radius) + 6px);
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow);
    }

    .signal-panel {
      position: relative;
      overflow: hidden;
      min-height: 470px;
      display: grid;
      align-content: end;
    }

    .signal-panel::before,
    .signal-panel::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      opacity: 0.8;
    }

    .signal-panel::before {
      width: 220px;
      height: 220px;
      top: 40px;
      right: -30px;
      background: radial-gradient(circle, rgba(0, 255, 255, 0.33), rgba(124,156,255,0.02));
    }

    .signal-panel::after {
      width: 180px;
      height: 180px;
      bottom: 100px;
      left: -30px;
      background: radial-gradient(circle, rgba(142,240,208,0.45), rgba(142,240,208,0.02));
    }

    .signal-stack {
      position: relative;
      display: grid;
      gap: 1rem;
      z-index: 1;
    }

    .metric {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.05rem;
      border-radius: 18px;
      background: rgba(8, 13, 28, 0.5);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .metric strong {
      display: block;
      font-size: 1.15rem;
      letter-spacing: -0.03em;
    }

    .metric span {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .metric-badge {
      white-space: nowrap;
      padding: 0.55rem 0.8rem;
      border-radius: 999px;
      background: rgba(142,240,208,0.12);
      color: #dff9ef;
      font-size: 0.85rem;
      font-weight: 700;
    }
    @media (max-width: 980px) {
      .hero-grid,
      .split,
      .cta-panel,
      .features,
      .quotes {
        grid-template-columns: 1fr;
      }

      .hero {
        padding-top: 3.5rem;
      }

      .signal-panel {
        min-height: auto;
      }
    }

  </style>
</head>
<body>
